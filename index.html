<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>强化石等级推荐器</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1>强化石等级推荐器</h1>
        <p class="subtitle">后期锚定指数模型 · 根据当前强化花费 C（k）推荐强化石等级</p>
      </header>

      <section class="card input-section">
        <p class="hint">请输入当前强化花费 C，单位为 k</p>
        <div class="input-row">
          <label for="input-c">C =</label>
          <input id="input-c" type="text" inputmode="decimal" placeholder="例如 25" />
          <button id="btn-calc" type="button">确认</button>
          <div class="highlight">
            <span class="highlight-label">推荐等级 d：</span>
            <span id="d-highlight" class="highlight-value">—</span>
          </div>
        </div>
      </section>

      <section class="card results-section">
        <h2>计算结果</h2>
        <dl class="results-grid" id="results">
          <div><dt>输入 C (k)</dt><dd id="out-input-c">—</dd></div>
          <div><dt>成功率 p</dt><dd id="out-p-rec">—</dd></div>
          <div><dt>E(p)=(f+C)/p (k)</dt><dd id="out-e-rec">—</dd></div>
          <div><dt>参考 C(d) (k)</dt><dd id="out-model-c">—</dd></div>
        </dl>
        <div class="candidate-table-wrap">
          <p class="candidate-title">floor / ceil 候选（比 E(p)=(f+C)/p，取更小者）</p>
          <table class="candidate-table">
            <thead>
              <tr>
                <th>d</th>
                <th>p</th>
                <th>E(p)</th>
                <th>参考 C(d)</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="candidate-tbody">
              <tr><td colspan="5">—</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card chart-section">
        <h2>C(d) 曲线</h2>
        <div class="chart-wrap">
          <canvas id="chart-c"></canvas>
        </div>
      </section>

      <footer class="footer">
        <p>模型：f(p)=300×1024<sup>p−1</sup>，C(d)=p·f′(p)−f(p)，d∈[1,9]</p>
        <p>
          <a href="https://github.com/tong815/shenqu-stone-recommender" id="repo-link" target="_blank" rel="noopener">GitHub 仓库</a>
          · 桌面版：<code>python calc_C.py</code>
        </p>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/model.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
